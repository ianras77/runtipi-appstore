name: Tipi CI
on:
  pull_request:
  push:
    branches:
      - master
      - app/wordpress_elderseth
env:
  npm_config_audit: 'false'
  npm_config_fund: 'false'
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4.1.0
        name: Install pnpm
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen tooling without repository lifecycle hooks
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm ci --prefix release-tools --ignore-scripts
          python -m pip install -r release-tools/requirements.txt
      - name: Run actual checked-in contract tests and inventory
        run: pnpm test
      - name: Run linter against this event's actual base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run lint:ci
