services:
  rapidforge:
    image: celdem/rapidforge:v0.14.0
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tipi_main_network
    labels:
      traefik.enable: "true"
      traefik.http.services.rapidforge.loadbalancer.server.port: "8080"
      traefik.http.routers.rapidforge-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.rapidforge-insecure.entrypoints: web
      traefik.http.routers.rapidforge-insecure.middlewares: rapidforge-web-redirect
      traefik.http.middlewares.rapidforge-web-redirect.redirectscheme.scheme: https
      traefik.http.routers.rapidforge.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.rapidforge.entrypoints: websecure
      traefik.http.routers.rapidforge.tls.certresolver: myresolver
      traefik.http.routers.rapidforge-local.rule: Host(`rapidforge.${LOCAL_DOMAIN}`)
      traefik.http.routers.rapidforge-local.entrypoints: websecure
      traefik.http.routers.rapidforge-local.tls: "true"
      runtipi.managed: "true"

networks:
  tipi_main_network:
    external: true
