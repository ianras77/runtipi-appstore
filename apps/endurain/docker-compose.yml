version: "3.7"

services:
  endurain:
    container_name: endurain
    image: ghcr.io/endurain-project/endurain:v0.20.1
    restart: unless-stopped
    environment:
      TZ: ${ENDURAIN_TZ}
      DB_TYPE: postgres
      DB_HOST: endurain-db
      DB_PORT: 5432
      DB_USER: endurain
      DB_PASSWORD: ${ENDURAIN_DB_PASSWORD}
      DB_DATABASE: endurain
      SECRET_KEY: ${ENDURAIN_SECRET_KEY}
      FERNET_KEY: ${ENDURAIN_FERNET_KEY}
      ENDURAIN_HOST: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      BEHIND_PROXY: "true"
    volumes:
      - ${APP_DATA_DIR}/data/backend:/app/backend/data
      - ${APP_DATA_DIR}/logs:/app/backend/logs
    ports:
      - ${APP_PORT}:8080
    depends_on:
      endurain-db:
        condition: service_healthy
    networks:
      - tipi_main_network
    labels:
      traefik.enable: "true"
      traefik.http.services.endurain.loadbalancer.server.port: "8080"
      traefik.http.routers.endurain-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.endurain-insecure.entrypoints: web
      traefik.http.routers.endurain-insecure.middlewares: endurain-web-redirect
      traefik.http.middlewares.endurain-web-redirect.redirectscheme.scheme: https
      traefik.http.routers.endurain.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.endurain.entrypoints: websecure
      traefik.http.routers.endurain.tls.certresolver: myresolver
      traefik.http.routers.endurain-local.rule: Host(`endurain.${LOCAL_DOMAIN}`)
      traefik.http.routers.endurain-local.entrypoints: websecure
      traefik.http.routers.endurain-local.tls: "true"
      runtipi.managed: "true"

  endurain-db:
    container_name: endurain-db
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: endurain
      POSTGRES_USER: endurain
      POSTGRES_PASSWORD: ${ENDURAIN_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endurain -d endurain"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tipi_main_network
    labels:
      runtipi.managed: "true"

networks:
  tipi_main_network:
    external: true
