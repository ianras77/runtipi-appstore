version: "3.7"

services:
  tirreno:
    container_name: tirreno
    image: tirreno/tirreno:v0.9.12
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/application:/var/www/html
    ports:
      - ${APP_PORT}:80
    depends_on:
      tirreno-db:
        condition: service_healthy
    networks:
      - tipi_main_network
    labels:
      traefik.enable: "true"
      traefik.http.services.tirreno.loadbalancer.server.port: "80"
      traefik.http.routers.tirreno-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.tirreno-insecure.entrypoints: web
      traefik.http.routers.tirreno-insecure.middlewares: tirreno-web-redirect
      traefik.http.middlewares.tirreno-web-redirect.redirectscheme.scheme: https
      traefik.http.routers.tirreno.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.tirreno.entrypoints: websecure
      traefik.http.routers.tirreno.tls.certresolver: myresolver
      traefik.http.routers.tirreno-local.rule: Host(`tirreno.${LOCAL_DOMAIN}`)
      traefik.http.routers.tirreno-local.entrypoints: websecure
      traefik.http.routers.tirreno-local.tls: "true"
      runtipi.managed: "true"

  tirreno-db:
    container_name: tirreno-db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tirreno
      POSTGRES_USER: tirreno
      POSTGRES_PASSWORD: ${TIRRENO_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirreno -d tirreno"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tipi_main_network
    labels:
      runtipi.managed: "true"

networks:
  tipi_main_network:
    external: true
